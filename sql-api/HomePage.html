<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliotheca - Your Digital Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #7c3aed;
            --secondary: #ec4899;
            --accent: #3b82f6;
            --dark: #1e1b4b;
            --light: #f8fafc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            opacity: 0.3;
        }

        .bg-animation span {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #ec4899);
            animation: float 15s infinite ease-in-out;
        }

        .bg-animation span:nth-child(1) {
            width: 300px;
            height: 300px;
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }

        .bg-animation span:nth-child(2) {
            width: 200px;
            height: 200px;
            top: 50%;
            right: -100px;
            animation-delay: 2s;
        }

        .bg-animation span:nth-child(3) {
            width: 250px;
            height: 250px;
            bottom: -125px;
            left: 30%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.1); }
            66% { transform: translate(-50px, 50px) scale(0.9); }
        }

        /* Navigation */
        nav {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(30, 27, 75, 0.95);
    -webkit-backdrop-filter: blur(20px);
    backdrop-filter: blur(20px);
    padding: 1rem 0;
    border-bottom: 1px solid rgba(124, 58, 237, 0.3);
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
}


        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 2rem;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #7c3aed, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .search-container {
            flex: 1;
            max-width: 600px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 0.875rem 1.5rem;
            padding-left: 3rem;
            border: 2px solid rgba(124, 58, 237, 0.3);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: #7c3aed;
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.4);
        }

        .search-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .search-icon {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.25rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .nav-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .nav-btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .nav-btn-primary {
            background: linear-gradient(135deg, #7c3aed, #ec4899);
            color: white;
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
        }

        .nav-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(124, 58, 237, 0.6);
        }

        .nav-btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(124, 58, 237, 0.3);
        }

        .nav-btn-secondary:hover {
            background: rgba(124, 58, 237, 0.2);
            border-color: #7c3aed;
        }

        .wishlist-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ec4899;
            color: white;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            box-shadow: 0 2px 10px rgba(236, 72, 153, 0.6);
        }

        /* Hero Section */
        .hero {
            padding: 4rem 2rem;
            text-align: center;
            position: relative;
        }

        .hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #fff 0%, #c4b5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
        }

        .hero p {
            font-size: 1.25rem;
            color: rgba(255, 255, 255, 0.8);
            max-width: 600px;
            margin: 0 auto 2rem;
        }

        .category-pills {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 3rem;
        }

        .pill {
            padding: 0.625rem 1.5rem;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(124, 58, 237, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .pill:hover, .pill.active {
            background: linear-gradient(135deg, #7c3aed, #ec4899);
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
        }

        /* Main Content */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem 4rem;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            font-weight: 700;
        }

        /* Books Grid */
        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 2rem;
        }

        .book-card {
    background: rgba(255, 255, 255, 0.05);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid rgba(124, 58, 237, 0.2);
    transition: all 0.4s ease;
    cursor: pointer;
    position: relative;
}


        .book-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 60px rgba(124, 58, 237, 0.4);
            border-color: #7c3aed;
        }

        .book-cover-container {
            position: relative;
            width: 100%;
            padding-top: 140%;
            overflow: hidden;
            background: linear-gradient(135deg, #4c1d95, #7c3aed);
        }

        .book-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .book-status {
    position: absolute;
    top: 1rem;
    right: 1rem;
    padding: 0.375rem 0.875rem;
    border-radius: 50px;
    font-size: 0.75rem;
    font-weight: 600;
    background: rgba(0,0,0,0.25);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
}


        .status-available {
            background: rgba(16, 185, 129, 0.9);
            color: white;
        }

        .status-loaned {
            background: rgba(239, 68, 68, 0.9);
            color: white;
        }

        .book-info {
            padding: 1.5rem;
        }

        .book-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #fff;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .book-author {
            color: #c4b5fd;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .book-author:hover {
            color: #ec4899;
        }

        .book-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .book-price {
            font-size: 1.75rem;
            font-weight: 700;
            color: #ec4899;
            margin-bottom: 1rem;
        }

        .book-actions {
            display: flex;
            gap: 0.75rem;
        }

        .btn {
            flex: 1;
            padding: 0.75rem;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.875rem;
        }

        .btn-loan {
            background: linear-gradient(135deg, #7c3aed, #6366f1);
            color: white;
        }

        .btn-loan:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.5);
        }

        .btn-loan:disabled {
            background: rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
            opacity: 0.5;
        }

        .btn-wishlist {
            background: rgba(236, 72, 153, 0.2);
            border: 2px solid #ec4899;
            color: #ec4899;
        }

        .btn-wishlist:hover {
            background: #ec4899;
            color: white;
            transform: translateY(-2px);
        }

        .btn-wishlist.active {
            background: #ec4899;
            color: white;
        }

        /* Authors Section */
        .authors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        .author-card {
    background: rgba(255, 255, 255, 0.05);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 2rem;
    border: 1px solid rgba(124, 58, 237, 0.2);
    transition: all 0.4s ease;
    cursor: pointer;
}


        .author-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(124, 58, 237, 0.3);
            border-color: #7c3aed;
        }

        .author-header {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .author-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c3aed, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            color: white;
        }

        .author-name {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .author-meta {
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .author-bio {
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
            margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .author-stats {
            display: flex;
            gap: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(124, 58, 237, 0.2);
        }

        .stat {
            flex: 1;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ec4899;
        }

        .stat-label {
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.6);
        }

        /* Loans & Wishlist */
        .list-container {
    background: rgba(255, 255, 255, 0.05);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 2rem;
    border: 1px solid rgba(124, 58, 237, 0.2);
}


        .list-item {
    background: rgba(255, 255, 255, 0.05);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    border-radius: 15px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    display: flex;
    gap: 1.5rem;
    align-items: center;
    transition: all 0.3s ease;
}


        .list-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateX(5px);
        }

        .list-item-cover {
            width: 80px;
            height: 120px;
            border-radius: 10px;
            object-fit: cover;
            background: linear-gradient(135deg, #4c1d95, #7c3aed);
            flex-shrink: 0;
        }

        .list-item-info {
            flex: 1;
        }

        .list-item-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .list-item-meta {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }

        .list-item-actions {
            display: flex;
            gap: 0.75rem;
        }

        .btn-small {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.875rem;
        }

        .btn-return {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        .btn-return:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
        }

        .btn-remove {
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid #ef4444;
            color: #ef4444;
        }

        .btn-remove:hover {
            background: #ef4444;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
        }

        .empty-icon {
            font-size: 5rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .empty-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 1rem;
            color: rgba(255, 255, 255, 0.8);
        }

        .empty-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.125rem;
        }

        /* Author Detail Modal */
       .modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    z-index: 2000;
    overflow-y: auto;
    padding: 2rem;
}


        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
    background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
    border-radius: 30px;
    max-width: 1000px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 3rem;
    border: 1px solid rgba(124, 58, 237, 0.3);
    position: relative;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
}


        .modal-close {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: rgba(239, 68, 68, 0.3);
            transform: rotate(90deg);
        }

        .total-summary {
            background: linear-gradient(135deg, #7c3aed, #ec4899);
            border-radius: 15px;
            padding: 2rem;
            text-align: center;
            margin-top: 2rem;
        }

        .total-label {
            font-size: 1rem;
            margin-bottom: 0.5rem;
            opacity: 0.9;
        }

        .total-amount {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 900;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }

            .nav-container {
                flex-direction: column;
                gap: 1rem;
            }

            .search-container {
                order: 3;
                width: 100%;
            }

            .books-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 1rem;
            }

            .authors-grid {
                grid-template-columns: 1fr;
            }

            .list-item {
                flex-direction: column;
                text-align: center;
            }
        }

        /* Loading Animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
        }
        /* Book Detail Modal */
.book-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    z-index: 2000;
    overflow-y: auto;
    padding: 2rem;
}

.book-modal.active {
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.3s ease;
}

.book-modal-content {
    background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
    border-radius: 30px;
    max-width: 900px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 3rem;
    border: 1px solid rgba(124, 58, 237, 0.3);
    position: relative;
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
}


.book-modal-header {
    display: flex;
    gap: 2rem;
    margin-bottom: 2rem;
}

.book-modal-cover {
    width: 200px;
    height: 300px;
    border-radius: 15px;
    object-fit: cover;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    flex-shrink: 0;
}

.book-modal-info h2 {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    margin-bottom: 0.5rem;
}

.book-modal-rating {
    color: #fbbf24;
    font-size: 1.5rem;
    margin: 1rem 0;
}

.book-modal-summary {
    line-height: 1.8;
    color: rgba(255, 255, 255, 0.9);
    margin-bottom: 2rem;
}

.reviews-section {
    margin-top: 2rem;
    padding-top: 2rem;
    border-top: 1px solid rgba(124, 58, 237, 0.3);
}

.review-card {
    background: rgba(255, 255, 255, 0.05);
    padding: 1.5rem;
    border-radius: 15px;
    margin-bottom: 1rem;
    border: 1px solid rgba(124, 58, 237, 0.2);
}

.review-header {
    display: flex;
    justify-content: space-between;
    margin-bottom: 0.5rem;
}

.review-author {
    font-weight: 600;
}

.review-rating {
    color: #fbbf24;
}

.review-text {
    color: rgba(255, 255, 255, 0.8);
    line-height: 1.6;
}

.review-date {
    font-size: 0.875rem;
    color: rgba(255, 255, 255, 0.5);
    margin-top: 0.5rem;
}
/* Review Form Styles */
.review-form {
    background: rgba(124, 58, 237, 0.1);
    border: 1px solid rgba(124, 58, 237, 0.3);
    border-radius: 15px;
    padding: 1.5rem;
    margin-top: 1.5rem;
}

.review-form h4 {
    font-family: 'Playfair Display', serif;
    font-size: 1.25rem;
    margin-bottom: 1rem;
    color: #c4b5fd;
}

.form-group {
    margin-bottom: 1rem;
}

.form-group label {
    display: block;
    margin-bottom: 0.5rem;
    color: rgba(255, 255, 255, 0.9);
    font-weight: 500;
}

.star-rating {
    display: flex;
    gap: 0.5rem;
    font-size: 2rem;
    cursor: pointer;
}

.star-rating span {
    transition: all 0.2s ease;
}

.star-rating span:hover,
.star-rating span.active {
    transform: scale(1.2);
}

.review-form textarea {
    width: 100%;
    padding: 0.75rem;
    border: 1px solid rgba(124, 58, 237, 0.3);
    border-radius: 10px;
    background: rgba(30, 27, 75, 0.5);
    color: #fff;
    font-family: 'Inter', sans-serif;
    font-size: 0.95rem;
    resize: vertical;
    min-height: 100px;
}

.review-form textarea::placeholder {
    color: rgba(255, 255, 255, 0.5);
}

.review-form textarea:focus {
    outline: none;
    border-color: #7c3aed;
    background: rgba(30, 27, 75, 0.7);
}

.review-card {
    background: rgba(124, 58, 237, 0.05);
    border: 1px solid rgba(124, 58, 237, 0.2);
    border-radius: 10px;
    padding: 1rem;
    margin-bottom: 1rem;
}

.review-header {
    display: flex;
    justify-content: space-between;

        // Loan a book
async function loanBook(bookId) {
    const book = booksData.find(b => b.id === bookId);
    if (!book || !book.available) {
        showNotification('❌ This book is not available');
        return;
    }

    if (!currentUser) {
        showNotification('❌ Please log in to loan books');
        return;
    }

    // Show loading notification
    showNotification('⏳ Processing loan...');

    try {
        // Call the backend API to process the loan
        const response = await fetch('http://localhost:3000/librarian/process-loan', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                userEmail: currentUser.email,
                bookId: bookId,
                duration: 1  // 1 month duration
            })
        });

        const data = await response.json();

        if (data.success) {
            // Update local data to reflect the change immediately
            book.available = false;
            
            // Refresh the book list from database to get accurate availability
            await fetchBooks();
            
            // Show success notification
            const dueDate = new Date();
            dueDate.setMonth(dueDate.getMonth() + 1);
            showNotification(`✅ Successfully loaned "${book.title}"! Due: ${dueDate.toLocaleDateString()}`);
        } else {
            showNotification('❌ ' + data.message);
            // Refresh books to get accurate availability
            await fetchBooks();
        }
    } catch (error) {
        console.error('Error loaning book:', error);
        showNotification('❌ Error processing loan. Please try again.');
        // Refresh books to get accurate availability
        await fetchBooks();
    }
}

        // Wishlist functions
function isInWishlist(bookId) {
            return wishlist.some(item => item.bookId === bookId);
        }

function toggleWishlist(bookId) {
            const book = booksData.find(b => b.id === bookId);
            if (!book) return;

            if (isInWishlist(bookId)) {
                wishlist = wishlist.filter(item => item.bookId !== bookId);
                showNotification(`Removed "${book.title}" from wishlist`);
            } else {
                wishlist.push({
                    bookId: book.id,
                    bookTitle: book.title,
                    author: book.author,
                    cover: book.cover,
                    price: book.price,
                    available: book.available
                });
                showNotification(`✨ Added "${book.title}" to wishlist`);
            }

            updateWishlistBadge();
            displayBooks(booksData);
            displayWishlist();
        }

        function updateWishlistBadge() {
            document.getElementById('wishlistBadge').textContent = wishlist.length;
        }

        function displayWishlist() {

                        <h3 class="empty-title">Your wishlist is empty</h3>

                    </div>
                `;
                return;
            }

            const totalValue = wishlist.reduce((sum, item) => sum + item.price, 0);

            container.innerHTML = `
                ${wishlist.map(item => `
                    <div class="list-item">
                        <img src="${item.cover}" alt="${item.bookTitle}" class="list-item-cover"
                             onerror="this.src='https://via.placeholder.com/80x120/4c1d95/ffffff'">
                        <div class="list-item-info">
                            <h3 class="list-item-title">${item.bookTitle}</h3>
                            <p class="list-item-meta">
                                <strong>Author:</strong> ${item.author}<br>
                                <strong>Price:</strong> $${item.price.toFixed(2)}<br>
                                <strong>Status:</strong> <span class="${item.available ? 'status-available' : 'status-loaned'}">${item.available ? 'Available' : 'On Loan'}</span>
                            </p>
                        </div>
                        <div class="list-item-actions">
                            <button class="btn-small btn-remove" onclick="toggleWishlist(${item.bookId})">
                                Remove
                            </button>
                        </div>
                    </div>
                `).join('')}
                <div class="total-summary">
                    <div class="total-label">Total Wishlist Value</div>
                    <div class="total-amount">$${totalValue.toFixed(2)}</div>
                </div>
            `;
        }

        // Display authors
        function displayAuthors() {
            const grid = document.getElementById('authorsGrid');
            
            grid.innerHTML = authorsData.map(author => {
                const authorBooks = booksData.filter(b => b.authorId === author.id);
                const initials = author.name.split(' ').map(n => n[0]).join('');
                
                return `
                    <div class="author-card" onclick="showAuthorDetail(${author.id})">
                        <div class="author-header">
                            <div class="author-avatar">${initials}</div>
                            <div>
                                <h3 class="author-name">${author.name}</h3>
                                <p class="author-meta">${author.nationality} • ${author.born}${author.died ? `-${author.died}` : ''}</p>
                            </div>
                        </div>
                        <p class="author-bio">${author.bio}</p>
                        <div class="author-stats">
                            <div class="stat">
                                <div class="stat-value">${authorBooks.length}</div>
                                <div class="stat-label">Books</div>
                            </div>
                            <div class="stat">
                                <div class="stat-value">${authorBooks.filter(b => b.available).length}</div>
                                <div class="stat-label">Available</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Show author detail
        function showAuthorDetail(authorId) {
            const author = authorsData.find(a => a.id === authorId);
            if (!author) return;

            const authorBooks = booksData.filter(b => b.authorId === authorId);
            const initials = author.name.split(' ').map(n => n[0]).join('');

            document.getElementById('authorModalContent').innerHTML = `
                <button class="modal-close" onclick="closeAuthorModal()">×</button>
                <div class="author-header" style="margin-bottom: 2rem;">
                    <div class="author-avatar" style="width: 120px; height: 120px; font-size: 3rem;">${initials}</div>
                    <div>
                        <h2 class="author-name" style="font-size: 2.5rem;">${author.name}</h2>
                        <p class="author-meta" style="font-size: 1.125rem;">${author.nationality} • ${author.born}${author.died ? `-${author.died}` : ' (Living)'}</p>
                    </div>
                </div>
                <p style="font-size: 1.125rem; line-height: 1.8; color: rgba(255,255,255,0.9); margin-bottom: 2rem;">${author.bio}</p>
                
                <h3 style="font-family: 'Playfair Display', serif; font-size: 2rem; margin-bottom: 1.5rem;">Books by ${author.name}</h3>
                <div class="books-grid" style="margin-top: 1.5rem;">
                    ${authorBooks.map(book => `
                        <div class="book-card">
                            <div class="book-cover-container">
                                <img src="${book.cover}" alt="${book.title}" class="book-cover"
                                     onerror="this.src='https://via.placeholder.com/240x340/4c1d95/ffffff?text=${encodeURIComponent(book.title)}'">
                                <span class="book-status ${book.available ? 'status-available' : 'status-loaned'}">
                                    ${book.available ? '✓ Available' : '✗ On Loan'}
                                </span>
                            </div>
                            <div class="book-info">
                                <h3 class="book-title">${book.title}</h3>
                                <div class="book-meta">
                                    <span>${book.genre}</span>
                                    <span>${book.year}</span>
                                </div>
                                <div class="book-price">$${book.price.toFixed(2)}</div>
                                <div class="book-actions">
                                    <button class="btn btn-loan" onclick="loanBook(${book.id}); closeAuthorModal();" ${!book.available ? 'disabled' : ''}>
                                        ${book.available ? '📖 Loan' : '⏱ Unavailable'}
                                    </button>
                                    <button class="btn btn-wishlist ${isInWishlist(book.id) ? 'active' : ''}" onclick="toggleWishlist(${book.id})">
                                        ${isInWishlist(book.id) ? '❤️' : '🤍'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;

            document.getElementById('authorModal').classList.add('active');
        }

        function closeAuthorModal() {
            document.getElementById('authorModal').classList.remove('active');
        }

        // Section navigation
        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(section => {
                section.classList.remove('active');
            });
            
            document.getElementById(sectionId).classList.add('active');

            if (sectionId === 'wishlist') {
                displayWishlist();
            } else if (sectionId === 'books') {
                displayBooks(booksData);
            }
        }

        // Search functionality
        function setupSearch() {
            const searchInput = document.getElementById('searchInput');
            let searchTimeout;

            searchInput.addEventListener('input', function(e) {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    const searchTerm = e.target.value.toLowerCase();
                    
                    if (!searchTerm) {
                        displayBooks(booksData);
                        return;
                    }

                    const filteredBooks = booksData.filter(book => 
                        book.title.toLowerCase().includes(searchTerm) ||
                        book.author.toLowerCase().includes(searchTerm) ||
                        book.genre.toLowerCase().includes(searchTerm)
                    );
                    
                    displayBooks(filteredBooks);
                }, 300);
            });
        }

        // Filter functionality
        function setupFilters() {
            document.querySelectorAll('.pill').forEach(pill => {
                pill.addEventListener('click', function() {
                    document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
                    this.classList.add('active');
                    
                    currentFilter = this.dataset.filter;
                    displayBooks(booksData);
                });
            });
        }

        // Notification system
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 100px;
                right: 2rem;
                background: linear-gradient(135deg, #7c3aed, #ec4899);
                color: white;
                padding: 1rem 1.5rem;
                border-radius: 15px;
                box-shadow: 0 10px 40px rgba(0,0,0,0.3);
                z-index: 3000;
                animation: slideIn 0.3s ease;
                max-width: 350px;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => notification.remove(), 300);
            }, 3000);
        }

        // Add animations
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(400px); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            @keyframes slideOut {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(400px); opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        // Close modal on outside click
        document.getElementById('authorModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeAuthorModal();
            }
        });
        // Global variable to store selected rating
let selectedRatings = {};

// Set rating stars
function setRating(bookId, rating) {
    selectedRatings[bookId] = rating;
    const stars = document.querySelectorAll(`#starRating-${bookId} span`);
    stars.forEach((star, index) => {
        if (index < rating) {
            star.classList.add('active');
        } else {
            star.classList.remove('active');
        }
    });
}

// Submit review
async function submitReview(event, bookId) {
    event.preventDefault();
    
    const rating = selectedRatings[bookId];
    const reviewText = document.getElementById(`reviewText-${bookId}`).value.trim();
    
    if (!rating) {
        alert('Please select a rating!');
        return;
    }

    if (!currentUser) {
        alert('Please log in to submit a review');
        return;
    }

    try {
        const response = await fetch('http://localhost:3000/reviews', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                userId: currentUser.userId,
                bookId: bookId,
                rating: rating,
                reviewText: reviewText || null
            })
        });

        const data = await response.json();

        if (data.success) {
            alert('✅ Review submitted successfully!');
            // Reset form
            delete selectedRatings[bookId];
            document.getElementById(`reviewText-${bookId}`).value = '';
            document.querySelectorAll(`#starRating-${bookId} span`).forEach(star => {
                star.classList.remove('active');
            });
            // Reload book details to show new review
            closeBookModal();
            setTimeout(() => showBookDetail(bookId), 300);
        } else {
            alert('❌ ' + data.message);
        }
    } catch (error) {
        console.error('Error submitting review:', error);
        alert('❌ Error submitting review. Please try again.');
    }
}

        init();
